<style>
:root{
  --fresa:#E8294B; --fresa-dark:#B31A38; --fresa-soft:#FFF0F3;
  --ink:#2B1A1F; --muted:#8A7178; --faint:#B7A4A9;
  --cream:#FFF7F4; --line:#F5E3E7; --line2:#EED4DA;
  --leaf:#2F8F5B; --leaf-soft:#E9F6EF; --amber:#D98614; --amber-soft:#FCF2E2;
  --shadow:0 1px 2px rgba(43,26,31,.04), 0 8px 24px -16px rgba(43,26,31,.16);

}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Archivo',system-ui,sans-serif;background:var(--cream);color:var(--ink);font-size:16px;-webkit-font-smoothing:antialiased;padding-bottom:calc(92px + var(--safe-b))}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;transition:transform .12s, background .15s}
button:active{transform:scale(.96)}
input,select{font-family:inherit;color:inherit;font-size:16px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.mono{font-family:'IBM Plex Mono',monospace}

#login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:22px}
.loginbox{width:100%;max-width:380px;text-align:center}
.loginbox .big{font-family:'Instrument Serif',serif;font-size:44px;margin-bottom:2px}
.loginbox .big em{color:var(--fresa);font-style:italic}

.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.loginbox .card{padding:24px 20px}
.lbl{display:block;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.14em;font-weight:800;color:var(--muted);margin-bottom:7px}
.loginbox select,.loginbox input{width:100%;margin-bottom:16px;padding:14px;border:1px solid var(--line2);border-radius:12px;background:#fff}

header{background:var(--ink);color:#fff;position:sticky;top:0;z-index:40;padding-top:env(safe-area-inset-top,0px)}

h2.page{font-family:'Instrument Serif',serif;font-size:26px;font-weight:400;margin:18px 0 4px}
p.sub{color:var(--muted);font-size:13.5px;line-height:1.55;margin-bottom:14px;max-width:56ch}

.sticky{position:sticky;top:calc(52px + env(safe-area-inset-top,0px));z-index:30;background:var(--cream);padding:8px 0;margin:0 -16px;padding-left:16px;padding-right:16px}
.searchbar{width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:9px}

/* Fila tienda: nombre + campo + pedir */
.fila{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow)}

.fcol{flex:none;text-align:center}
.fcol > label{display:block;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);margin-bottom:3px}

.cajitas .cant{width:60px;height:48px;font-size:17px}

/* Excel vivo (dirección) */
.xr{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow)}
.xr .top{display:flex;align-items:center;gap:8px}
.xr .nm{font-weight:700;font-size:15px;flex:1;min-width:0;line-height:1.25}

.dias.rojo{background:#FCE7EB;color:var(--fresa-dark)}

.xg{display:flex;gap:6px;margin-top:9px}
.xg .c{flex:1;text-align:center}
.xg label{display:block;font-size:9px;font-weight:800;text-transform:uppercase;color:var(--faint);margin-bottom:3px}

/* Bloques compra / solicitudes */
.bloque{background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:14px;overflow:hidden;box-shadow:var(--shadow)}
.bhead{background:var(--ink);color:#fff;padding:12px 15px;display:flex;align-items:center;gap:10px}
.bhead b{font-size:15px}
.bhead .mono{margin-left:auto;font-size:11px;color:#C8B3B8}
.linea{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid #FAF0F2}
.linea:last-of-type{border-bottom:none}
.linea .lx{flex:1;min-width:0}
.linea .nm{font-weight:700;font-size:14.5px;line-height:1.25}

.linea .cant{width:74px;height:46px;font-size:17px}
.linea .cant.hecha{border-color:#BFE3CE;color:var(--leaf);background:#F8FCF9}
.uni{font-size:10.5px;color:var(--muted);font-weight:700;flex:none;max-width:56px}
button.bhead.acc{width:100%;justify-content:flex-start;border:none;font-family:inherit;font-size:inherit}
.bhead .flecha{font-size:14px;color:#C8B3B8;margin-left:2px}
.gsuc{background:var(--cream);padding:8px 14px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);border-bottom:1px solid var(--line)}
.bfoot{padding:12px 14px;background:#FFFBFA;border-top:1px solid var(--line);display:flex;gap:8px}
.btn{background:var(--fresa);color:#fff;border-radius:12px;padding:13px 16px;font-weight:700;font-size:14px;box-shadow:0 4px 14px -6px rgba(232,41,75,.5)}
.btn:active{background:var(--fresa-dark)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line2);box-shadow:none}
.btn.wide{width:100%}
.bfoot .btn{flex:1}
.okbtn{flex:none;height:46px;padding:0 13px;background:var(--fresa);color:#fff;border-radius:12px;font-weight:800}

.expbar2{display:flex;gap:8px;margin:2px 0 12px}
.expbar2 .btn{flex:1}
.fbody{padding:14px}
.fbody input[type=text],.fbody input[type=number],.fbody select{width:100%;padding:12px;border:1px solid var(--line2);border-radius:11px;background:#fff;margin-bottom:10px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.flbl{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:800;color:var(--muted);margin-bottom:5px}
.chk2{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700;color:var(--muted);margin:2px 0 12px}
.chk2 input{width:20px;height:20px;accent-color:var(--fresa)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:45;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding-bottom:var(--safe-b);box-shadow:0 -6px 24px -14px rgba(43,26,31,.28)}
.tabbar button{flex:1;padding:10px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:700;color:var(--faint);position:relative;min-height:62px;justify-content:center}
.tabbar .tic{font-size:21px;line-height:1;filter:grayscale(1) opacity(.55)}
.tabbar button.on{color:var(--fresa-dark)}
.tabbar button.on .tic{filter:none}
.tabbar button.on::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:26px;height:3px;border-radius:0 0 3px 3px;background:var(--fresa)}
.tabbar .pip{position:absolute;top:6px;right:calc(50% - 22px);min-width:17px;height:17px;line-height:17px;background:var(--fresa);color:#fff;border-radius:9px;font-size:10px;font-weight:800;padding:0 4px}

#toast{position:fixed;left:16px;right:16px;bottom:calc(100px + var(--safe-b));background:var(--ink);color:#fff;padding:14px 18px;border-radius:14px;font-size:14px;font-weight:600;z-index:80;box-shadow:0 12px 32px -10px rgba(0,0,0,.45);text-align:center;max-width:520px;margin:0 auto;opacity:0;visibility:hidden;pointer-events:none;transform:translateY(14px);transition:opacity .22s, transform .28s, visibility 0s linear .3s;display:flex;align-items:center;justify-content:center;gap:14px}
#toast.on{opacity:1;visibility:visible;transform:translateY(0);transition-delay:0s;pointer-events:auto}
.tundo{color:#FF8FA5;font-weight:800;font-size:14px;padding:4px 8px;text-transform:uppercase}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>

<div id="login">
  <div class="loginbox">
    <div class="big">🍓 Lady <em>Fresa</em></div>
    <div class="sublog">Control de inventarios · <b>v20</b></div>
    <div class="card">
      <span class="lbl">¿Dónde estás?</span>

      <span class="lbl">Tu PIN</span>

        onkeydown="if(event.key==='Enter')entrar()" oninput="if(this.value.length===4)entrar()">
      <div class="loginerr" id="lg-err"></div>
      <button class="btn wide" onclick="entrar()">Entrar</button>
    </div>
  </div>
</div>

<div id="shell" style="display:none">
  <header><div class="hrow">
    <div class="brand">🍓 <em>Lady Fresa</em></div>
    <span class="aqui" id="ctx"></span>
    <button class="iconbtn" onclick="salir()">Salir</button>
  </div></header>
  <div class="wrap" id="app"></div>

</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db = supabase.createClient('https://ngpumyxxxlafuzcsaepy.supabase.co','sb_publishable_6Kma0iIJ6mFCK1A7YTDnRw_HKqxsLQv');

/* ===== Notificaciones push ===== */
const VAPID_PUB = 'BEb1urSUxK_EUnJI8QJl2Y4fMSTE937N1Xv_NMtudzY8n-h_QHS_0rKCeuigdFypNSlwd6UdnbRcc12Cdp8lQhc';
const FN_URL = 'https://ngpumyxxxlafuzcsaepy.supabase.co/functions/v1/lfi-push';
const ANON = 'sb_publishable_6Kma0iIJ6mFCK1A7YTDnRw_HKqxsLQv';
let pushOK = false;
if ('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
function b64ToU8(b){ const p='='.repeat((4-b.length%4)%4); const x=(b+p).replace(/-/g,'+').replace(/_/g,'/'); const r=atob(x); return Uint8Array.from([...r].map(c=>c.charCodeAt(0))); }
function notificar(tipo, sucursal, titulo, cuerpo, endpoint){
  try{ fetch(FN_URL, {method:'POST', headers:{'content-type':'application/json','Authorization':'Bearer '+ANON,'apikey':ANON},
    body: JSON.stringify({tipo, sucursal, titulo, cuerpo, endpoint})}).catch(()=>{}); }catch(e){}
}
async function checarPush(){
  try{
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    pushOK = !!sub && Notification.permission === 'granted';
  }catch(e){}
}
async function activarAvisos(){
  try{
    if (!('serviceWorker' in navigator) || !('PushManager' in window)){ toast('Este navegador no soporta avisos.'); return; }
    const esIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
    const instalada = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
    if (esIOS && !instalada){ toast('En iPhone primero agrega la app a tu pantalla de inicio (botón Compartir → Agregar a inicio) y ábrela desde ahí.'); return; }
    const perm = await Notification.requestPermission();
    if (perm !== 'granted'){ toast('No se activaron los avisos.'); return; }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey: b64ToU8(VAPID_PUB)});
    const j = sub.toJSON();
    await db.from('lfi_push_subs').upsert({sucursal:sesion.sucursal, rol:sesion.rol, nombre:quien(), endpoint:sub.endpoint, p256dh:j.keys.p256dh, auth:j.keys.auth}, {onConflict:'endpoint'});
    pushOK = true; render();
    toast('🔔 Avisos activados. Te mandé uno de prueba.');
    notificar('test', sesion.sucursal, '🔔 Avisos activados', 'Así te van a llegar los avisos de Lady Fresa.', sub.endpoint);
  }catch(e){ toast('No se pudo activar: ' + (e.message || e)); }
}
function avisosBar(){
  if (pushOK || !sesion) return '';
  return `<button class="btn ghost wide" style="margin-top:12px" onclick="activarAvisos()">🔔 Activar avisos en este teléfono</button>`;
}

const LOCS = {
  centro:    {n:'Bodega (CEDIS)', short:'CEDIS', mini:'CED'},
  moctezuma: {n:'Tienda Moctezuma', short:'Moctezuma', mini:'MOC'},
  narvarte:  {n:'Tienda Narvarte', short:'Narvarte', mini:'NAR'},
  balbuena:  {n:'Tienda Balbuena', short:'Balbuena', mini:'BAL'},
};
const ORDEN_LOCS = ['moctezuma','narvarte','balbuena','centro'];
const TIENDAS_ORD = ['moctezuma','narvarte','balbuena','centro'];
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hoy = () => new Date().toISOString().slice(0,10);

let CAT=[], INV={}, INVD={}, PRES={}, SOLIC=[], EQUIPO=[], RECETAS={};
let sesion=null, tab='inv', q='', fcat='', soloVenta=true, hechasCom={}, pidiendo=null, enviando=null, prodSel=null, recSel=null;
const solActiva = s => !s.recibida_at;                      // pendiente o en camino
const solPend   = s => !s.enviada_at && !s.recibida_at;     // aún no se la mandan
const solCamino = s => !!s.enviada_at && !s.recibida_at;    // ya va en camino

const isDir = () => sesion && sesion.rol === 'direccion';
const veCostos = () => isDir() && !!(sesion && sesion.ve_costos);
const quien = () => (sesion && sesion.nombre) || 'Alguien';
const item = id => CAT.find(i => i.id === id);
const stock = (l,id) => Number((INV[l]||{})[id]) || 0;
const esFrac = i => !!(i && i.fraccion);
const esMulti = i => !!(i && i.multi && (PRES[i.id]||[]).length);
const cajasDe = id => PRES[id] || [];
const fmtCant = (i,n) => { const v = Number(n)||0; return esFrac(i) ? (Math.round(v*1000)/1000).toLocaleString('es-MX',{maximumFractionDigits:3}) : String(Math.round(v)); };
const limpia = (i,n) => esFrac(i) ? Math.max(0, Math.round((Number(n)||0)*1000)/1000) : Math.max(0, Math.round(Number(n)||0));
const money = n => '$' + (Math.round(n*100)/100).toLocaleString('es-MX', {maximumFractionDigits: 2});
const costoEmp = i => (Number(i.costo)||0) * (Number(i.factor) > 0 ? Number(i.factor) : 1);
const posTotal = id => ORDEN_LOCS.reduce((a,l) => a + stock(l,id), 0);
const stockCajas = (l,id) => { const d = (INVD[l]||{})[id] || {}; return cajasDe(id).reduce((a,p)=>a+(Number(d[p.id])||0),0); };
const desgloseDe = (l,id) => (INVD[l]||{})[id] || {};

/* Cobertura: cuántos días te alcanza lo que hay en TODO el negocio */
function cobertura(i){
  const c = Number(i.consumo_mes)||0;
  if (!c) return null;
  return Math.floor(posTotal(i.id) / (c/30));
}

async function cargar(){
  const [ins, stk, prs, sol, acc, rec, recl] = await Promise.all([
    db.from('lfi_insumos').select('*').eq('activo', true).order('categoria').order('nombre'),
    db.from('lfi_stock').select('*'),
    db.from('lfi_presentaciones').select('*').order('orden'),
    db.from('lfi_solicitudes').select('*').order('created_at', {ascending:false}).limit(120),
    db.from('lfi_accesos').select('*').order('sucursal').order('nombre'),
    db.from('lfi_recetas').select('*'),
    db.from('lfi_receta_lineas').select('*').order('id'),
  ]);
  CAT = ins.data || [];
  INV = {}; INVD = {}; PRES = {};
  Object.keys(LOCS).forEach(l => { INV[l]={}; INVD[l]={}; });
  (stk.data||[]).forEach(s => { if(INV[s.sucursal]){ INV[s.sucursal][s.insumo_id]=Number(s.cantidad); if(s.desglose) INVD[s.sucursal][s.insumo_id]=s.desglose; } });
  (prs.data||[]).forEach(p => { (PRES[p.insumo_id]=PRES[p.insumo_id]||[]).push(p); });
  SOLIC = sol.data || [];
  EQUIPO = acc.data || [];
  RECETAS = {};
  (rec.data||[]).forEach(r => { RECETAS[r.producto_id] = {rendimiento: Number(r.rendimiento)||1, lineas: []}; });
  (recl.data||[]).forEach(l => { if (RECETAS[l.producto_id]) RECETAS[l.producto_id].lineas.push(l); });
}

/* ===== Sesión ===== */
document.getElementById('lg-suc').innerHTML = Object.keys(LOCS).map(l => `<option value="${l}">${LOCS[l].n}</option>`).join('');
async function entrar(){
  const suc = document.getElementById('lg-suc').value;
  const pin = document.getElementById('lg-pin').value.trim();
  const err = document.getElementById('lg-err'); err.textContent='';
  if (!/^\d{4}$/.test(pin)){ err.textContent='El PIN es de 4 números.'; return; }
  const { data } = await db.from('lfi_accesos').select('*').eq('sucursal',suc).eq('pin',pin).maybeSingle();
  if (!data){ err.textContent='PIN incorrecto para esa sucursal.'; return; }
  sesion = {sucursal:data.sucursal, rol:data.rol, nombre:data.nombre || LOCS[data.sucursal].short, ve_costos: !!data.ve_costos};
  try{ localStorage.setItem('lfs_sesion', JSON.stringify(sesion)); }catch(e){}
  tab = 'inv';
  await arrancar();
}
async function arrancar(){
  document.getElementById('login').style.display='none';
  document.getElementById('shell').style.display='';
  await cargar(); await checarPush(); render();
}
function salir(){ try{ localStorage.removeItem('lfs_sesion'); }catch(e){} location.reload(); }

/* ===== Toast ===== */
let toastT=null, toastFn=null;
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),3000); }
function toastAccion(m, et, fn){ const t=document.getElementById('toast'); toastFn=fn;
  t.innerHTML=`<span>${m}</span><button class="tundo" onclick="toastFn&&toastFn();toastFn=null;this.closest('#toast').classList.remove('on')">${et}</button>`;
  t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>{t.classList.remove('on');toastFn=null;},5000); }

/* ===== Acciones ===== */
async function contar(loc, id, val){
  const i = item(id); const nueva = limpia(i, val); const antes = stock(loc,id);
  if (nueva === antes) return;
  INV[loc][id] = nueva;
  const { error } = await db.rpc('lfi_ajustar', {p_suc:loc, p_insumo:id, p_nueva:nueva, p_por:quien()});
  if (error){ toast('No se guardó. Revisa tu internet.'); INV[loc][id]=antes; render(); return; }
  toastAccion(`${esc(i.nombre)} ${LOCS[loc].mini} → ${fmtCant(i,nueva)}`, 'Deshacer', () => contar(loc, id, antes));
  render();
}
async function contarCajas(loc, id){
  const i = item(id);
  const dg = {};
  cajasDe(id).forEach(p => { const v = Math.max(0, Math.round(Number(document.getElementById(`cj-${loc}-${id}-${p.id}`)?.value)||0)); if (v>0) dg[p.id]=v; });
  const fn = i && i.suma_piezas ? 'lfi_ajustar_desglose' : 'lfi_ajustar_cajas';
  const { error } = await db.rpc(fn, {p_suc:loc, p_insumo:id, p_desglose:dg, p_por:quien()});
  if (error){ toast('No se guardó.'); return; }
  toast('✓ ' + esc(i ? i.nombre : '') + ' guardado');
  await cargar(); render();
}
/* La tienda avisa: "ya no tengo esto, mándame tanto" */
function tieneSolic(loc, id){ return SOLIC.find(s => s.sucursal===loc && s.insumo_id===id && solActiva(s)); }
function abrirPedir(id){
  pidiendo = id; render();
  setTimeout(() => document.getElementById('pd-'+id)?.focus(), 60);
}
async function confirmarPedir(loc, id){
  const i = item(id);
  const v = limpia(i, document.getElementById('pd-'+id)?.value);
  const { error } = await db.from('lfi_solicitudes').insert({sucursal:loc, insumo_id:id, por:quien(), cantidad: v > 0 ? v : null});
  pidiendo = null;
  if (error){ toast('No se pudo avisar.'); render(); return; }
  notificar('pedido', loc, '🙋 ' + LOCS[loc].short + ' pide', i.nombre + (v > 0 ? ': ' + fmtCant(i,v) + ' ' + i.unidad : '') + ' · ' + quien());
  toast('🙋 Avisado. Andrés lo va a ver.');
  await cargar(); render();
}
async function quitarPedir(id){
  const s = SOLIC.find(x => x.id === id);
  if (!s) return;
  await db.from('lfi_solicitudes').delete().eq('id', s.id);
  toast('Aviso quitado');
  await cargar(); render();
}
/* Dirección: "Ya se lo mandé" — mueve bodega→tienda y marca enviada */
async function enviarSolic(sid){
  const s = SOLIC.find(x => x.id === sid); if (!s) return;
  const i = item(s.insumo_id);
  const v = limpia(i, document.getElementById('env-'+sid)?.value);
  if (v <= 0){ toast('Pon cuánto le mandas.'); return; }
  const disp = stock('centro', s.insumo_id);
  const r1 = await db.rpc('lfi_mover', {p_suc:'centro', p_insumo:s.insumo_id, p_delta:-v, p_tipo:'salida', p_nota:'Pedido enviado a '+LOCS[s.sucursal].short, p_por:quien()});
  if (r1.error){ toast('No se pudo registrar el envío.'); return; }
  await db.rpc('lfi_mover', {p_suc:s.sucursal, p_insumo:s.insumo_id, p_delta:v, p_tipo:'entrada', p_nota:'Enviado del comisariato (pedido)', p_por:quien()});
  await db.from('lfi_solicitudes').update({enviada_at:new Date().toISOString(), enviada_por:quien(), enviada_cant:v, resuelto:true}).eq('id', sid);
  enviando = null;
  notificar('enviado', s.sucursal, '🚚 Viene en camino', i.nombre + ': ' + fmtCant(i,v) + ' ' + i.unidad + ' · ' + quien());
  const suc = s.sucursal;
  toastAccion(disp < v ? `✓ Enviado (en bodega solo había ${fmtCant(i,disp)})` : `✓ ${esc(i.nombre)}: ${fmtCant(i,v)} a ${LOCS[suc].short}`, 'Deshacer', async () => {
    await db.rpc('lfi_mover', {p_suc:suc, p_insumo:s.insumo_id, p_delta:-v, p_tipo:'ajuste', p_nota:'Deshecho: envío de pedido', p_por:quien()});
    await db.rpc('lfi_mover', {p_suc:'centro', p_insumo:s.insumo_id, p_delta:v, p_tipo:'ajuste', p_nota:'Deshecho: envío (regreso a bodega)', p_por:quien()});
    await db.from('lfi_solicitudes').update({enviada_at:null, enviada_por:null, enviada_cant:null, resuelto:false}).eq('id', sid);
    toast('↩︎ Envío deshecho, el pedido volvió a pendientes'); await cargar(); render();
  });
  await cargar(); render();
}
/* Tienda: confirmar que llegó (con cantidad editable si llegó distinto) */
async function recibirSolic(sid, conCampo){
  const so = SOLIC.find(x => x.id === sid); if (!so) return;
  const i = item(so.insumo_id);
  const env = Number(so.enviada_cant) || 0;
  let v = env;
  if (conCampo){
    const el = document.getElementById('rc-'+sid);
    v = limpia(i, el ? el.value : env);
    if (v <= 0){ toast('Pon cuánto llegó de verdad.'); return; }
  }
  const delta = Math.round((v - env)*1000)/1000;
  if (delta !== 0){
    const { error } = await db.rpc('lfi_mover', {p_suc:so.sucursal, p_insumo:so.insumo_id, p_delta:delta, p_tipo:'ajuste', p_nota:'Ajuste al recibir pedido (llegó '+fmtCant(i,v)+' de '+fmtCant(i,env)+')', p_por:quien()});
    if (error){ toast('No se pudo ajustar.'); return; }
  }
  await db.from('lfi_solicitudes').update({recibida_at:new Date().toISOString(), recibida_por:quien(), recibida_cant:v}).eq('id', sid);
  toastAccion(delta === 0 ? '✓ Recibido completo' : `✓ Recibido: ${fmtCant(i,v)} (se ajustó tu inventario)`, 'Deshacer', async () => {
    if (delta !== 0) await db.rpc('lfi_mover', {p_suc:so.sucursal, p_insumo:so.insumo_id, p_delta:-delta, p_tipo:'ajuste', p_nota:'Deshecho: ajuste al recibir', p_por:quien()});
    await db.from('lfi_solicitudes').update({recibida_at:null, recibida_por:null, recibida_cant:null}).eq('id', sid);
    toast('↩︎ Regresó a "viene en camino"'); await cargar(); render();
  });
  await cargar(); render();
}
/* Costos: se capturan como los compras (por empaque); se guardan por unidad */
let qCost = '';
async function guardarCosto(id, val){
  const i = item(id); if (!i) return;
  const f = Number(i.factor) > 0 ? Number(i.factor) : 1;
  const porUnidad = Math.round(((Number(val)||0) / f) * 10000) / 10000;
  const { error } = await db.from('lfi_insumos').update({costo: porUnidad}).eq('id', id);
  if (error){ toast('No se guardó el costo.'); return; }
  i.costo = porUnidad;
  toast(`💰 ${esc(i.nombre)}: ${money(Number(val)||0)} por ${esc(i.empaque || i.unidad)}`);
  render();
}
/* Dirección: eliminar un pedido del registro (no mueve inventario) */
async function eliminarSolic(sid){
  if (!confirm('¿Eliminar este pedido del registro? El inventario no se mueve, solo se borra el registro.')) return;
  await db.from('lfi_solicitudes').delete().eq('id', sid);
  toast('🗑 Pedido eliminado del registro');
  await cargar(); render();
}
/* Tienda: des-recibir un pedido (corrección tardía, en cualquier momento) */
async function desRecibir(sid){
  const so = SOLIC.find(x => x.id === sid); if (!so || !so.recibida_at) return;
  const i = item(so.insumo_id); if (!i) return;
  if (!confirm(`¿Regresar "${i.nombre}" a "viene en camino" para corregirlo?`)) return;
  const delta = Math.round(((Number(so.recibida_cant) || Number(so.enviada_cant) || 0) - (Number(so.enviada_cant) || 0))*1000)/1000;
  if (delta !== 0){
    const { error } = await db.rpc('lfi_mover', {p_suc:so.sucursal, p_insumo:so.insumo_id, p_delta:-delta, p_tipo:'ajuste', p_nota:'Corrección: se des-recibió el pedido', p_por:quien()});
    if (error){ toast('No se pudo corregir.'); return; }
  }
  await db.from('lfi_solicitudes').update({recibida_at:null, recibida_por:null, recibida_cant:null}).eq('id', sid);
  toast('↩︎ Regresó a "viene en camino". Recíbelo de nuevo con el número correcto.');
  await cargar(); render();
}
/* Compra del mes: llegó → entra a bodega */
async function llego(id){
  const i = item(id);
  const f = Number(i.factor) > 0 ? Number(i.factor) : 1;
  const raw = Number(document.getElementById(`cp-${id}`)?.value)||0;
  const v = limpia(i, f !== 1 ? raw * f : raw);
  if (v <= 0){ toast('Pon cuánto llegó.'); return; }
  const { error } = await db.rpc('lfi_mover', {p_suc:'centro', p_insumo:id, p_delta:v, p_tipo:'entrada', p_nota:'Compra del mes '+(i.proveedor||''), p_por:quien()});
  if (error){ toast('No se pudo registrar.'); return; }
  hechasCom[id] = true;
  toastAccion(`✓ ${esc(i.nombre)}: ${fmtCant(i,v)} a bodega`, 'Deshacer', async () => {
    await db.rpc('lfi_mover', {p_suc:'centro', p_insumo:id, p_delta:-v, p_tipo:'ajuste', p_nota:'Deshecho: llegada de compra', p_por:quien()});
    hechasCom[id] = false;
    toast('↩︎ Llegada deshecha'); await cargar(); render();
  });
  await cargar(); render();
}
/* Entrada directa de mercancía y transferencias entre ubicaciones */
let formInv = null;   // 'ent' | 'tra' | null
function insumoPorNombre(n){
  const t = (n||'').trim().toLowerCase();
  return CAT.find(i => !esMulti(i) && i.nombre.toLowerCase() === t);
}
async function registrarEntrada(){
  const i = insumoPorNombre(document.getElementById('en-ins')?.value);
  if (!i){ toast('Elige un insumo de la lista.'); return; }
  const v = limpia(i, document.getElementById('en-cant')?.value);
  if (v <= 0){ toast('Pon la cantidad que entra.'); return; }
  const loc = document.getElementById('en-loc').value;
  const nota = (document.getElementById('en-nota')?.value || '').trim();
  const { error } = await db.rpc('lfi_mover', {p_suc:loc, p_insumo:i.id, p_delta:v, p_tipo:'entrada', p_nota:'Entrada de mercancía' + (nota ? ' · ' + nota : ''), p_por:quien()});
  if (error){ toast('No se pudo registrar.'); return; }
  formInv = null;
  toastAccion(`✓ Entraron ${fmtCant(i,v)} ${esc(i.unidad)} de ${esc(i.nombre)} a ${LOCS[loc].short}`, 'Deshacer', async () => {
    await db.rpc('lfi_mover', {p_suc:loc, p_insumo:i.id, p_delta:-v, p_tipo:'ajuste', p_nota:'Deshecho: entrada de mercancía', p_por:quien()});
    toast('↩︎ Entrada deshecha'); await cargar(); render();
  });
  await cargar(); render();
}
async function registrarSalida(){
  const i = insumoPorNombre(document.getElementById('sa-ins')?.value);
  if (!i){ toast('Elige un insumo de la lista.'); return; }
  const v = limpia(i, document.getElementById('sa-cant')?.value);

    await db.rpc('lfi_mover', {p_suc:loc, p_insumo:i.id, p_delta:v, p_tipo:'ajuste', p_nota:'Deshecho: salida', p_por:quien()});

async function transferirMerc(){
  const i = insumoPorNombre(document.getElementById('tr-ins')?.value);
  if (!i){ toast('Elige un insumo de la lista.'); return; }
  const de = document.getElementById('tr-de').value, a = document.getElementById('tr-a').value;
  if (de === a){ toast('El origen y el destino son el mismo.'); return; }
  const v = limpia(i, document.getElementById('tr-cant')?.value);
  if (v <= 0){ toast('Pon la cantidad a transferir.'); return; }
  const disp = stock(de, i.id);
  const r1 = await db.rpc('lfi_mover', {p_suc:de, p_insumo:i.id, p_delta:-v, p_tipo:'salida', p_nota:'Transferencia a ' + LOCS[a].short, p_por:quien()});
  if (r1.error){ toast('No se pudo transferir.'); return; }
  await db.rpc('lfi_mover', {p_suc:a, p_insumo:i.id, p_delta:v, p_tipo:'entrada', p_nota:'Transferencia de ' + LOCS[de].short, p_por:quien()});
  formInv = null;
  toastAccion(disp < v ? `✓ Transferido (en ${LOCS[de].short} solo había ${fmtCant(i,disp)})` : `✓ ${fmtCant(i,v)} ${esc(i.unidad)} ${LOCS[de].short} → ${LOCS[a].short}`, 'Deshacer', async () => {
    await db.rpc('lfi_mover', {p_suc:a,  p_insumo:i.id, p_delta:-v, p_tipo:'ajuste', p_nota:'Deshecho: transferencia', p_por:quien()});
    await db.rpc('lfi_mover', {p_suc:de, p_insumo:i.id, p_delta:v,  p_tipo:'ajuste', p_nota:'Deshecho: transferencia (regreso)', p_por:quien()});
    toast('↩︎ Transferencia deshecha'); await cargar(); render();
  });
  await cargar(); render();
}

/* Producción: la receta descuenta ingredientes y da de alta el producto */
function costoReceta(pid){
  const r = RECETAS[pid]; if (!r) return 0;
  return r.lineas.reduce((a,l) => a + Number(l.cantidad) * (Number(item(l.insumo_id)?.costo)||0), 0);
}
async function recalcCostoProducto(pid){
  const r = RECETAS[pid]; if (!r) return;
  const total = costoReceta(pid);
  const rinde = Number(r.rendimiento)||1;
  if (total > 0 && rinde > 0)
    await db.from('lfi_insumos').update({costo: Math.round((total/rinde)*10000)/10000}).eq('id', pid);
}
async function producir(){
  const pid = prodSel; const rec = RECETAS[pid]; const prod = item(pid);
  if (!prod || !rec || !rec.lineas.length){ toast('Primero arma la receta en ⚙️ Ajustes → Recetas.'); return; }
  const lotes = Math.round((Number(document.getElementById('pr-lotes')?.value)||0)*100)/100;
  if (lotes <= 0){ toast('Pon cuántos lotes vas a hacer.'); return; }
  const rinde = Math.round((Number(rec.rendimiento)||1) * lotes * 1000)/1000;
  for (const l of rec.lineas){
    const v = Math.round(Number(l.cantidad) * lotes * 1000)/1000;
    const r = await db.rpc('lfi_mover', {p_suc:'centro', p_insumo:l.insumo_id, p_delta:-v, p_tipo:'salida', p_nota:'Producción: ' + prod.nombre, p_por:quien()});
    if (r.error){ toast('No se pudo descontar ' + (item(l.insumo_id)?.nombre||'un ingrediente')); return; }
  }
  await db.rpc('lfi_mover', {p_suc:'centro', p_insumo:pid, p_delta:rinde, p_tipo:'entrada', p_nota:'Producción (' + lotes + ' lote' + (lotes!==1?'s':'') + ')', p_por:quien()});
  await recalcCostoProducto(pid);

/* Exportar solicitudes del mes a Excel (CSV) */
function descargar(nombre, contenido){
  const blob = new Blob(['\uFEFF' + contenido], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nombre + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
}
async function exportarSolic(offset){
  const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - (offset||0));
  const ini = d.toISOString().slice(0,10);
  const f = new Date(d); f.setMonth(f.getMonth()+1);
  const fin = f.toISOString().slice(0,10);
  const { data, error } = await db.from('lfi_solicitudes').select('*')
    .gte('created_at', ini).lt('created_at', fin).order('created_at');
  if (error){ toast('No se pudo exportar.'); return; }
  if (!data || !data.length){ toast('No hay pedidos en ese mes.'); return; }
  const esc2 = x => '"' + String(x ?? '').replace(/"/g,'""') + '"';
  const filas = [['Fecha','Tienda','Insumo','Unidad','Pidió','Cant. pedida','Enviada','Envió','Recibida','Recibió','Fecha recibido','Estado'].join(',')];
  data.forEach(x => {
    const i = item(x.insumo_id);
    const est = x.recibida_at ? 'Recibido' : x.enviada_at ? 'En camino' : 'Pendiente';
    filas.push([
      String(x.created_at).slice(0,10),
      LOCS[x.sucursal] ? LOCS[x.sucursal].short : x.sucursal,
      esc2(i ? i.nombre : x.insumo_id),
      esc2(i ? i.unidad : ''),
      esc2(x.por),
      x.cantidad ?? '',
      x.enviada_cant ?? '',
      esc2(x.enviada_por),
      x.recibida_cant ?? (x.recibida_at ? (x.enviada_cant ?? '') : ''),
      esc2(x.recibida_por),
      x.recibida_at ? String(x.recibida_at).slice(0,10) : '',
      est,
    ].join(','));
  });
  descargar('pedidos_' + ini.slice(0,7), filas.join('\n'));
  toast('⬇︎ Exportado. Ábrelo en Excel.');
}
function copiar(txt){ navigator.clipboard?.writeText(txt).then(()=>toast('Copiado. Pégalo en WhatsApp.')).catch(()=>toast('No se pudo copiar.')); }

/* ===== Compra del mes ===== */
function compraMes(){
  return CAT.map(i => {
    if (i.diario) return null;                     // la fresa se compra diario, aparte
    const c = Number(i.consumo_mes)||0; if (!c) return null;
    const pos = posTotal(i.id);
    let falta = esFrac(i) ? Math.round((c-pos)*10)/10 : Math.ceil(c-pos);
    if (falta <= 0) return null;
    const f = Number(i.factor) > 0 ? Number(i.factor) : 1;
    const packs = f !== 1 ? Math.ceil(falta/f) : falta;
    return {i, pos, c, falta, packs, f, dias: cobertura(i)};
  }).filter(Boolean).sort((a,b) => (a.dias??999) - (b.dias??999));
}
function textoCompra(prov, items){
  const L = [`🍓 *Lady Fresa* — compra del mes (${hoy()})`, '', `*${prov}*`, ''];
  items.forEach(n => {
    if (n.f !== 1) L.push(`• ${n.i.nombre}: *${n.packs} ${n.i.empaque||'paquete'}${n.packs!==1?'s':''}*`);
    else L.push(`• ${n.i.nombre}: *${fmtCant(n.i,n.falta)} ${n.i.unidad}*`);
  });
  L.push('', '¡Gracias!');
  return L.join('\n');
}

        <div class="lx"><div class="nm">${esc(i.nombre)} → ${LOCS[s.sucursal].short}</div>
          <div class="mt">¿cuánto le mandas? · en bodega tienes ${fmtCant(i,disp)} ${esc(i.unidad)}</div></div>
        <input class="cant" type="number" inputmode="${esFrac(i)?'decimal':'numeric'}" id="env-${s.id}" value="${s.cantidad ? fmtCant(i,s.cantidad) : ''}" placeholder="0"
          onkeydown="if(event.key==='Enter')enviarSolic(${s.id})" onfocus="this.select()">
        <span class="uni">${esc(i.unidad)}</span>
        <button class="okbtn" onclick="enviarSolic(${s.id})">✓</button>
      </div>`;
    }
    return `<div class="linea">
      <div class="lx"><div class="nm">${esc(i.nombre)}</div>
        <div class="mt">pide <b>${s.cantidad ? fmtCant(i,s.cantidad)+' '+esc(i.unidad) : 'que le mandes'}</b> · tienen ${fmtCant(i, stock(s.sucursal, i.id))} · bodega ${fmtCant(i,disp)} · ${s.por ? esc(s.por)+' · ' : ''}hace ${hrs < 1 ? 'un rato' : hrs + ' h'}</div></div>
      <button class="okbtn" onclick="enviando=${s.id};render();setTimeout(()=>document.getElementById('env-${s.id}')?.focus(),60)">✓ Ya se lo mandé</button>
    </div>`;
  };
  const filaCamino = s => {
    const i = item(s.insumo_id); if (!i) return '';
    return `<div class="linea">
      <div class="lx"><div class="nm">${esc(i.nombre)}</div>
        <div class="mt">enviaste <b>${s.enviada_cant ? fmtCant(i,s.enviada_cant)+' '+esc(i.unidad) : '—'}</b> · esperando que confirmen recibido</div></div>
    </div>`;
  };
  const filaCerrada = s => {
    const i = item(s.insumo_id); if (!i) return '';
    return `<div class="linea" style="opacity:.55">
      <div class="lx"><div class="nm">${esc(i.nombre)}</div>
        <div class="mt">${LOCS[s.sucursal].short} recibió <b>${s.enviada_cant ? fmtCant(i,s.enviada_cant)+' '+esc(i.unidad) : ''}</b>${s.recibida_por ? ' · confirmó '+esc(s.recibida_por) : ''} · ${String(s.recibida_at).slice(0,10)}</div></div>
    </div>`;
  };

  const porTienda = (lista, fila) => TIENDAS_ORD.map(su => {
    const xs = lista.filter(x => x.sucursal === su);
    if (!xs.length) return '';
    return `<div class="gsuc">${esc(LOCS[su] ? LOCS[su].short : su)} · ${xs.length}</div>` + xs.map(fila).join('');
  }).join('');
  return `<h2 class="page">Me piden</h2>
  <p class="sub">Al dar <b>✓ Ya se lo mandé</b> pones cuánto mandas: sale de tu bodega, entra a la tienda y queda registrado. La tienda confirma cuando le llegue.</p>
  ${pend.length ? `<div class="bloque"><div class="bhead"><b>🙋 Pendientes</b><span class="mono">${pend.length}</span></div>${porTienda(pend, filaPend)}</div>` : ''}
  ${camino.length ? `<div class="bloque"><div class="bhead" style="background:var(--leaf)"><b>🚚 En camino</b><span class="mono">${camino.length}</span></div>${porTienda(camino, filaCamino)}</div>` : ''}
  ${cerradas.length ? `<div class="bloque"><div class="bhead" style="background:#8A7178"><b>✓ Recibidos</b><span class="mono">últimos ${cerradas.length}</span></div>${cerradas.map(filaCerrada).join('')}</div>` : ''}
  ${resumenMes()}`;
}

/* Resumen de control del mes: todas las tiendas, con exportación */
function resumenMes(){
  const mes = hoy().slice(0,7);
  const del = SOLIC.filter(x => String(x.created_at).slice(0,7) === mes);
  const porSuc = {};
  del.forEach(x => { (porSuc[x.sucursal]=porSuc[x.sucursal]||[]).push(x); });
  const cuerpo = Object.keys(porSuc).map(su => {
    const xs = porSuc[su];
    const rec = xs.filter(x => x.recibida_at).length;
    return `<div class="seccion" style="padding:0 14px">${esc(LOCS[su] ? LOCS[su].short : su)} · ${xs.length} pedidos · ${rec} recibidos</div>
    ${xs.map(x => {
      const i = item(x.insumo_id); if (!i) return '';
      const est = x.recibida_at
        ? `<b style="color:var(--leaf)">recibió ${x.recibida_cant!=null ? fmtCant(i,x.recibida_cant) : (x.enviada_cant!=null ? fmtCant(i,x.enviada_cant) : '✓')}</b>${x.recibida_cant!=null && x.enviada_cant!=null && Number(x.recibida_cant)!==Number(x.enviada_cant) ? ` <span style="color:var(--amber)">(enviaste ${fmtCant(i,x.enviada_cant)})</span>` : ''}`
        : x.enviada_at ? '<b style="color:var(--leaf)">🚚 en camino</b>'
        : '<b style="color:var(--fresa)">pendiente</b>';
      return `<div class="linea">
        <div class="lx"><div class="nm">${esc(i.nombre)}</div>
          <div class="mt">${String(x.created_at).slice(5,10).split('-').reverse().join('/')} · pidió ${x.por ? esc(x.por) : '—'} ${x.cantidad!=null ? fmtCant(i,x.cantidad)+' '+esc(i.unidad) : ''} · ${est}</div></div>
        <button class="okbtn" style="background:#F3E9EC;color:var(--muted)" onclick="eliminarSolic(${x.id})">✕</button>
      </div>`;
    }).join('')}`;
  }).join('');
  return `<div class="bloque" style="margin-top:6px">
    <div class="bhead"><b>📊 Control del mes</b><span class="mono">${del.length} pedidos</span></div>
    ${cuerpo || '<div class="empty" style="padding:18px">Sin pedidos este mes todavía.</div>'}
    <div class="bfoot">
      <button class="btn ghost" onclick="exportarSolic(0)">⬇︎ Exportar este mes</button>
      <button class="btn ghost" onclick="exportarSolic(1)">⬇︎ Mes anterior</button>
    </div>
  </div>`;
}

/* — DIRECCIÓN: compra del mes — */
function vCompra(){
  const ns = compraMes();
  if (!ns.length) return `<h2 class="page">Compra del mes</h2>
    <div class="card empty"><div class="emx">🎉</div><b>Estás cubierto</b>Con lo que hay en todo el negocio alcanza para el consumo del mes.</div>`;
  const porProv = {};
  ns.forEach(n => { const p = n.i.proveedor || 'Sin proveedor'; (porProv[p]=porProv[p]||[]).push(n); });
  const costoDe = n => costoEmp(n.i) > 0 ? (n.f > 1 ? n.packs * costoEmp(n.i) : n.falta * (Number(n.i.costo)||0)) : 0;
  const granTotal = ns.reduce((a,n) => a + costoDe(n), 0);
  const sinCosto = ns.filter(n => !(Number(n.i.costo)>0)).length;
  const bloques = Object.entries(porProv).map(([p, items]) => `
    <div class="bloque">
      <div class="bhead"><b>${esc(p)}</b><span class="mono">${items.length} insumos${veCostos() && items.some(x=>costoDe(x)>0) ? ' · ' + money(items.reduce((a,x)=>a+costoDe(x),0)) : ''}</span></div>
      ${items.map(n => {
        const hecha = hechasCom[n.i.id];
        return `<div class="linea">
          <div class="lx"><div class="nm">${esc(n.i.nombre)}</div>
            <div class="mt">tienes ${fmtCant(n.i,n.pos)} en total · gastas ${fmtCant(n.i,n.c)}/mes${n.dias!==null?` · te alcanza <b>${n.dias} días</b>`:''}${veCostos() && costoDe(n)>0 ? ` · <b>≈ ${money(costoDe(n))}</b>` : ''}</div></div>
          <input class="cant ${hecha?'hecha':''}" type="number" inputmode="numeric" id="cp-${n.i.id}"
            value="${n.f!==1 ? n.packs : fmtCant(n.i,n.falta)}" onfocus="this.select()">
          <span class="uni">${n.f!==1 ? esc(n.i.empaque||'paq') : esc(n.i.unidad)}</span>
          <button class="okbtn" onclick="llego('${n.i.id}')">${hecha?'↺':'✓ Llegó'}</button>
        </div>`;
      }).join('')}
      <div class="bfoot">
        <button class="btn ghost" onclick='copiar(textoCompra(${JSON.stringify(p)}, compraMes().filter(n => (n.i.proveedor||"Sin proveedor")===${JSON.stringify(p)})))'>📋 Copiar para WhatsApp</button>
      </div>
    </div>`).join('');
  return `<h2 class="page">Compra del mes</h2>
  <p class="sub">Lo que falta para cubrir <b>un mes de consumo real</b> con lo que hay en todo el negocio. Copia la lista a cada proveedor; cuando llegue, dale <b>✓ Llegó</b> y entra a tu bodega solo.</p>
  ${veCostos() && granTotal > 0 ? `<div class="card" style="padding:14px 16px;margin-bottom:12px;display:flex;align-items:baseline;gap:10px">
    <span class="mt" style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)">Esta compra te va a costar</span>
    <span class="mono" style="font-size:22px;font-weight:700;margin-left:auto">${money(granTotal)}</span>
  </div>${sinCosto ? `<p class="sub" style="margin-top:-6px;font-size:12px">⚠ ${sinCosto} insumos aún sin costo capturado (agrégalos en ⚙️ Ajustes → Costos) — el total real será mayor.</p>` : ''}` : ''}
  ${bloques}`;
}

/* — DIRECCIÓN: ajustes (insumos y equipo) — */
let ajSec = null;
function vAjustes(){
  const catsExist = cats();
  const provs = [...new Set(CAT.map(i => i.proveedor).filter(Boolean))];
  const porSuc = {};
  EQUIPO.forEach(a => { (porSuc[a.sucursal]=porSuc[a.sucursal]||[]).push(a); });

  const sec = (id, titulo, extra, contenido) => `
  <div class="bloque">
    <button class="bhead acc" onclick="ajSec = ajSec==='${id}' ? null : '${id}'; render()">
      <b>${titulo}</b><span class="mono">${extra}</span><span class="flecha">${ajSec===id?'▾':'▸'}</span>
    </button>
    ${ajSec===id ? contenido : ''}
  </div>`;

  const cIns = `<div class="fbody">
      <label class="flbl">Nombre</label>
      <input type="text" id="ni-nombre" placeholder="Ej. Salsa de fresa">
      <div class="fgrid">
        <div><label class="flbl">Categoría</label>
          <input type="text" id="ni-cat" list="dl-cats" placeholder="Comestibles"><datalist id="dl-cats">${catsExist.map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div>
        <div><label class="flbl">Unidad (como se cuenta)</label>
          <input type="text" id="ni-uni" placeholder="kg, pza, botella…"></div>
        <div><label class="flbl">Proveedor</label>
          <input type="text" id="ni-prov" list="dl-provs" placeholder="opcional"><datalist id="dl-provs">${provs.map(p=>`<option value="${esc(p)}">`).join('')}</datalist></div>
        <div><label class="flbl">Consumo al mes</label>
          <input type="number" inputmode="decimal" id="ni-cons" placeholder="opcional"></div>
        <div><label class="flbl">Empaque de compra</label>
          <input type="text" id="ni-emp" placeholder="caja, paquete…"></div>
        <div><label class="flbl">Piezas por empaque</label>
          <input type="number" inputmode="numeric" id="ni-factor" placeholder="1"></div>
        ${veCostos() ? `<div><label class="flbl">Costo (como lo compras)</label>
          <input type="number" inputmode="decimal" id="ni-costo" placeholder="$ opcional"></div>` : ''}
      </div>
      <label class="chk2"><input type="checkbox" id="ni-frac"> Se cuenta con decimales (se pesa: kg, litros)</label>
      <button class="btn wide" onclick="crearInsumo()">Crear insumo</button>
    </div>`;

  const listaCos = CAT.filter(i => qCost ? i.nombre.toLowerCase().includes(qCost.toLowerCase()) : (Number(i.consumo_mes)>0 || i.diario));
  const cCos = `<div class="fbody" style="padding-bottom:6px">
      <input type="text" placeholder="Buscar insumo…" value="${esc(qCost)}" style="margin-bottom:4px"
        oninput="qCost=this.value;render();const els=[...document.querySelectorAll('input')];const el=els.find(x=>x.placeholder==='Buscar insumo…');el.focus();el.setSelectionRange(el.value.length,el.value.length)">
    </div>
    ${listaCos.map(i => {
      const f = Number(i.factor) > 0 ? Number(i.factor) : 1;
      const val = i.costo ? Math.round(costoEmp(i)*100)/100 : '';
      return `<div class="linea">
        <div class="lx"><div class="nm">${esc(i.nombre)}</div>
          <div class="mt">costo por <b>${esc(i.empaque || i.unidad)}</b>${f!==1 ? ` (${f} ${esc(i.unidad)})` : ''}${i.costo ? ` · ≈ ${money(i.costo)} por ${esc(i.unidad)}` : ''}</div></div>
        <input class="cant" type="number" inputmode="decimal" value="${val}" placeholder="$" onfocus="this.select()" onchange="guardarCosto('${i.id}', this.value)">
      </div>`;
    }).join('')}`;

  const cEq = `<div class="fbody">
      <div class="fgrid">
        <div><label class="flbl">Sucursal</label>
          <select id="eq-suc">${Object.keys(LOCS).map(l=>`<option value="${l}">${LOCS[l].n}</option>`).join('')}</select></div>
        <div><label class="flbl">Nombre</label>
          <input type="text" id="eq-nombre" placeholder="Ej. María"></div>
      </div>
      <label class="flbl">PIN (4 números, único por sucursal)</label>
      <input type="text" id="eq-pin" inputmode="numeric" maxlength="4" placeholder="Ej. 3742">
      ${veCostos() ? `<label class="chk2"><input type="checkbox" id="eq-costos"> 💰 Puede ver costos y valores en pesos</label>` : ''}
      <button class="btn wide" onclick="crearAcceso()">Crear acceso</button>
    </div>
    ${Object.keys(porSuc).map(su => `
      <div class="seccion" style="padding:0 14px">${esc(LOCS[su] ? LOCS[su].n : su)}</div>
      ${porSuc[su].map(a => `<div class="linea">
        <div class="lx"><div class="nm">${esc(a.nombre || 'Sin nombre')}</div>
          <div class="mt">PIN ${esc(String(a.pin))} · ${a.rol === 'direccion' ? 'dirección' : 'tienda'}${a.ve_costos ? ' · 💰 ve costos' : ''}</div></div>
        <button class="okbtn" style="background:#F3E9EC;color:var(--muted)" onclick="borrarAcceso(${a.id}, '${esc(a.nombre||'esta persona')}')">✕</button>
      </div>`).join('')}`).join('')}`;

  const cRec = (() => {
    const prods = Object.keys(RECETAS).map(pid => item(pid)).filter(Boolean);
    if (!recSel || !RECETAS[recSel]) recSel = prods[0] ? prods[0].id : null;
    const rec = recSel ? RECETAS[recSel] : null;
    const prod = recSel ? item(recSel) : null;
    const dlIns = `<datalist id="dl-rec-ins">${CAT.filter(i => !esMulti(i) && i.id !== recSel).map(i => `<option value="${esc(i.nombre)}">`).join('')}</datalist>`;
    return `<div class="fbody">
      <label class="flbl">Producto</label>
      <select onchange="recSel=this.value;render()">${prods.map(p => `<option value="${p.id}" ${p.id===recSel?'selected':''}>${esc(p.nombre)}</option>`).join('')}</select>
      ${rec ? `
      <label class="flbl">Un lote rinde (en ${esc(prod.unidad)})</label>
      <input type="number" inputmode="decimal" value="${rec.rendimiento}" onfocus="this.select()" onchange="setRendimiento('${recSel}', this.value)">
      <div class="seccion" style="margin:6px 0 4px">Ingredientes por lote</div>
      ${rec.lineas.map(l => { const li = item(l.insumo_id); if (!li) return '';
        return `<div class="linea" style="padding:8px 0">
          <div class="lx"><div class="nm" style="font-size:14px">${esc(li.nombre)}</div><div class="mt">${esc(li.unidad)}</div></div>
          <input class="cant" style="height:44px" type="number" inputmode="decimal" value="${l.cantidad}" onfocus="this.select()" onchange="setLineaCant(${l.id}, '${recSel}', this.value)">
          <button class="okbtn" style="background:#F3E9EC;color:var(--muted);height:44px" onclick="quitarLinea(${l.id}, '${recSel}')">✕</button>
        </div>`; }).join('') || '<div class="mt" style="margin-bottom:8px">Sin ingredientes todavía — agrégalos abajo.</div>'}
      ${dlIns}
      <div class="linea" style="padding:10px 0;border-top:1px dashed var(--line2)">
        <input type="text" id="re-ins" list="dl-rec-ins" placeholder="Agregar ingrediente…" style="flex:1;margin-bottom:0">
        <input class="cant" style="height:44px;width:70px" type="number" inputmode="decimal" id="re-cant" placeholder="cant.">
        <button class="okbtn" style="height:44px" onclick="agregarLinea('${recSel}')">✓</button>
      </div>` : ''}
      <div class="linea" style="padding:10px 0;border-top:1px solid var(--line)">
        <input type="text" id="re-nuevo" list="dl-rec-ins" placeholder="Hacer receta para otro insumo…" style="flex:1;margin-bottom:0">
        <button class="okbtn" style="height:44px" onclick="crearReceta()">➕</button>
      </div>
    </div>`;
  })();
  return `<h2 class="page">Ajustes</h2>
  <p class="sub">Toca una sección para abrirla.</p>
  ${sec('rec', '🥣 Recetas', Object.keys(RECETAS).length, cRec)}
  ${sec('ins', '➕ Nuevo insumo', '', cIns)}
  ${veCostos() ? sec('cos', '💰 Costos', qCost ? listaCos.length + ' resultados' : 'solo tú', cCos) : ''}
  ${sec('eq', '👥 Equipo y PINs', EQUIPO.length, cEq)}`;
}

/* ===== Render ===== */
function irTab(k){ tab=k; q=''; window.scrollTo(0,0); render(); }
function render(){
  document.getElementById('ctx').textContent = `${quien()} · ${LOCS[sesion.sucursal].short}`;
  if (!isDir()){
    const nCam = SOLIC.filter(x => x.sucursal === sesion.sucursal && solCamino(x)).length;
    const tabsT = [['contar','Contar','📦',0], ['mis','Mis pedidos','🙋',nCam]];
    const viewsT = {contar:vTienda, mis:vMisPedidos};
    if (!viewsT[tab]) tab = 'contar';
    document.getElementById('nav').style.display='';
    document.getElementById('nav').innerHTML = tabsT.map(([k,n,ic,p]) =>
      `<button class="${tab===k?'on':''}" onclick="irTab('${k}')"><span class="tic">${ic}</span>${n}${p?`<span class="pip">${p}</span>`:''}</button>`).join('');
    document.getElementById('app').innerHTML = avisosBar() + viewsT[tab]();
    return;
  }
  const tabs = [['inv','Inventario','📦',0], ['pid','Me piden','🙋',SOLIC.filter(solPend).length], ['com','Compra','🛒',0], ['aj','Ajustes','⚙️',0]];
  const views = {inv:vExcel, pid:vPiden, com:vCompra, aj:vAjustes};
  if (!views[tab]) tab='inv';
  document.getElementById('nav').style.display='';
  document.getElementById('nav').innerHTML = tabs.map(([k,n,ic,p]) =>
    `<button class="${tab===k?'on':''}" onclick="irTab('${k}')"><span class="tic">${ic}</span>${n}${p?`<span class="pip">${p}</span>`:''}</button>`).join('');
  document.getElementById('app').innerHTML = avisosBar() + views[tab]();
}

(async () => {
  try{
    const s = localStorage.getItem('lfs_sesion');
    if (s){ sesion = JSON.parse(s); tab='inv'; await arrancar(); }
  }catch(e){}
})();
document.addEventListener('visibilitychange', async () => {
  if (!document.hidden && sesion && document.activeElement?.tagName !== 'INPUT'){ await cargar(); render(); }
});
</script>
